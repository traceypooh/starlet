<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captain Starlet #1</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Captain Starlet #1">
<meta property="og:url" content="https://traceypooh.github.io/starlet/">
<meta property="og:image" content="https://traceypooh.github.io/starlet/panel01.jpg">
<meta property="og:image:width" content="1289">
<meta property="og:image:height" content="832">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://traceypooh.github.io/starlet/panel01.jpg">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #page {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  /* invisible left/right click zones */
  .zone {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 50%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #prev { left: 0; cursor: w-resize; }
  #next { right: 0; cursor: e-resize; }

  #hud {
    position: fixed;
    right: 12px;
    bottom: 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    opacity: 0.25;
    transition: opacity 0.2s;
    z-index: 1;
  }
  #hud:hover, body.active #hud { opacity: 0.9; }
  #hud span, #hud button {
    background: rgba(0, 0, 0, 0.6);
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
  }
  #hud button { cursor: pointer; }
  #hud button:hover { background: #333; }
</style>
</head>
<body>
<img id="page" alt="">
<div id="prev" class="zone" title="Previous (←)"></div>
<div id="next" class="zone" title="Next (→)"></div>
<div id="hud">
  <span id="count"></span>
  <button id="fs" title="Fullscreen (F)">⛶ Fullscreen</button>
</div>

<script>
const PAGES = [
  'cover.jpg',
  'panel01.jpg',
  'panel02.jpg',
  'panel03.png',
  'panel04.jpg',
  'panel05.jpg',
  'panel06.jpg',
  'panel07.jpg',
  'panel08.jpg',
  'panel09.jpg',
  'panel10.jpg',
  'issue2.jpg',
]

const img = document.getElementById('page')
const count = document.getElementById('count')
const fsBtn = document.getElementById('fs')

// page index lives in the URL hash (#1 = cover) so reloads/links keep your place
let idx = Math.min(Math.max((parseInt(location.hash.slice(1), 10) || 1) - 1, 0), PAGES.length - 1)

function show(i) {
  idx = Math.min(Math.max(i, 0), PAGES.length - 1)
  img.src = PAGES[idx]
  img.alt = `Page ${idx + 1} of ${PAGES.length}`
  count.textContent = `${idx + 1} / ${PAGES.length}`
  history.replaceState(null, '', `#${idx + 1}`)
  // preload neighbors so page turns are instant
  for (const j of [idx + 1, idx - 1])
    if (PAGES[j]) new Image().src = PAGES[j]
}

const next = () => show(idx + 1)
const prev = () => show(idx - 1)

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen()
  else document.documentElement.requestFullscreen?.()
}

document.getElementById('next').addEventListener('click', next)
document.getElementById('prev').addEventListener('click', prev)
fsBtn.addEventListener('click', toggleFullscreen)
document.addEventListener('fullscreenchange', () => {
  fsBtn.textContent = document.fullscreenElement ? '✕ Exit fullscreen' : '⛶ Fullscreen'
})

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return
  switch (e.key) {
    case 'ArrowRight': case 'PageDown': case ' ': next(); break
    case 'ArrowLeft': case 'PageUp': prev(); break
    case 'Home': show(0); break
    case 'End': show(PAGES.length - 1); break
    case 'f': case 'F': toggleFullscreen(); break
    default: return
  }
  e.preventDefault()
})

// swipe on touch screens
let touchX = null
document.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX }, { passive: true })
document.addEventListener('touchend', (e) => {
  if (touchX === null) return
  const dx = e.changedTouches[0].clientX - touchX
  touchX = null
  if (Math.abs(dx) > 50) {
    e.preventDefault() // don't also fire a click on the side zone
    dx < 0 ? next() : prev()
  }
}, { passive: false })

// briefly brighten the controls when the mouse moves
let hideTimer
document.addEventListener('mousemove', () => {
  document.body.classList.add('active')
  clearTimeout(hideTimer)
  hideTimer = setTimeout(() => document.body.classList.remove('active'), 1500)
})

// hide the fullscreen button where the API doesn't exist (e.g. iPhone Safari)
if (!document.documentElement.requestFullscreen) fsBtn.hidden = true

show(idx)
</script>
</body>
</html>
